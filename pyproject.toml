[project]
name = "wfcollector"
version = "0.1.0"
description = "Collector utility for WeatherFlow weather stations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.3",
    "aiohttp==3.9.5",
    "influxdb_client==1.44.0",
    "mysql-connector-python==8.4.0",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pytz==2024.1",
    "websockets==12.0",
    "wfcollector",
]
[dependency-groups]
dev = ["colorama", "pytest", "pytest-cov"]

[tool.uv_build]
src = "src"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q  --cov=wfcollector --cov-report=xml --cov-report=html"
testpaths = ["test"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.pyright]
include = ["src", "test"]
exclude = [
    "docker_data",
    "doc",
    "**/node_modules",
    "**/cdk.out",
    "**/.pytest_cache",
    "**/build",
    "**/dist",
    "**/.vscode",
    "**/__pycache__",
    "**/*.egg-info",
    "**/*.ruff_cache",
]

[tool.ruff]
line-length = 180
target-version = "py311"

[tool.pylint.messages_control]
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
    "R0903", # too-few-public-methods
    "R0913", # too-many-arguments
    "R0914", # too-many-locals
    "W1203", # logging-format-interpolation
    "W0718", # exception-escape
    "W0511", # TODOs
]

[tool.pylint.basic]
good-names = [
    "i",
    "j",
    "k",
    "ex",
    "Run",
    "_",
    "x",
    "y",
    "z",
    "id",
    "db",
    "pk",
    "ok",
    "T",
    "R",
    "Mw",
]


[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

